name: Docker Push

on:

  push:
    branches:
      - main

jobs:

  docker:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t docker-push-dockerhub .

      - name: tag to docker hub
        run: docker tag docker-push-dockerhub luisazevedo9/docker-push-dockerhub

      - name: push to docker hub
        run: docker push luisazevedo9/docker-push-dockerhub:latest
