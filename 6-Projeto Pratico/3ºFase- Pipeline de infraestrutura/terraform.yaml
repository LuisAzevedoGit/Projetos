name: Terraform CI/CD


# This workflow will run terraform plan and optionally(select true if you want to run terraform apply) terraform apply on push or pull request events.
#trigger manually from the Actions tab in your repository.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Executar o terraform apply'
        required: true
        default: 'false'
        type: choice
        options:
          - true
          - false


      plan_destroy:
        description: 'planear o terraform destroy'
        required: true
        default: 'false'
        type: choice
        options:
          - true
          - false    

      destroy:
        description: 'Executar o terraform destroy'
        required: true
        default: 'false'
        type: choice
        options:
          - true
          - false    

permissions:
  contents: read
  id-token: write


jobs:
  job1:
    name: Terraform
    env:
      ACCOUNT_ID: ${{ secrets.ACCOUNT_ID}}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::ACCOUNT_ID:role/GitHubAccessRole
          aws-region: eu-north-1

      - name: HashiCorp - Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1

      - name: Terraform Init
        working-directory: 6-Projeto Pratico/3ºFase- Pipeline de infraestrutura
        run: terraform init

      - name: Terraform Validate
        working-directory: 6-Projeto Pratico/3ºFase- Pipeline de infraestrutura
        run: terraform validate

      - name: Terraform Plan
        working-directory: 6-Projeto Pratico/3ºFase- Pipeline de infraestrutura
        run: terraform plan -out=tfplan.tfout

      - name: Terraform Apply
        working-directory: 6-Projeto Pratico/3ºFase- Pipeline de infraestrutura
        if: ${{ github.event.inputs.apply == 'true' }}
        run: terraform apply -auto-approve tfplan.tfout         

      - name: Terraform plan destroy
        working-directory: 6-Projeto Pratico/3ºFase- Pipeline de infraestrutura
        if: ${{ github.event.inputs.plan_destroy == 'true' }}
        run: terraform plan -destroy -out=tfplandestroy


      - name: Terraform destroy
        working-directory: 6-Projeto Pratico/3ºFase- Pipeline de infraestrutura
        if: ${{ github.event.inputs.destroy == 'true' }}
        run: terraform apply  -destroy -auto-approve tfplandestroy   