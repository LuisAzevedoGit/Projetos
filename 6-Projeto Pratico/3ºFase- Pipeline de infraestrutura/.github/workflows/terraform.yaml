name: Terraform CI/CD


# This workflow will run terraform plan and optionally(select true if you want to run terraform apply) terraform apply on push or pull request events.
#trigger manually from the Actions tab in your repository.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Executar o terraform apply'
        required: true
        default: 'false'
        type: choice
        options:
          - true
          - false

permissions:
  contents: read
  id-token: write


jobs:
  job1:
    name: Terraform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::367332297990:role/GitHubAccessRole
          aws-region: eu-north-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.7.6  

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan.tfout

      - name: Terraform Apply
        if: ${{ github.event.inputs.apply == 'true' }}
        run: terraform apply -auto-approve tfplan.tfout         