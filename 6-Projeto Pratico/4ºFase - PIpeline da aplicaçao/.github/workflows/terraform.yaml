name: Terraform CI/CD


# This workflow will run terraform plan and optionally(select true if you want to run terraform apply) terraform apply on push or pull request events.
#trigger manually from the Actions tab in your repository.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Executar o terraform apply'
        required: true
        default: 'false'
        type: choice
        options:
          - true
          - false


      plan_destroy:
        description: 'planear o terraform destroy'
        required: true
        default: 'false'
        type: choice
        options:
          - true
          - false    

      destroy:
        description: 'Executar o terraform destroy'
        required: true
        default: 'false'
        type: choice
        options:
          - true
          - false    

permissions:
  contents: read
  id-token: write


jobs:
  job1:
    name: Terraform
    env:
      ACCOUNT_ID: ${{ secrets.ACCOUNT_ID}}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug OIDC Token
        run: |
          curl -s -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
          | jq -r '.value' | cut -d '.' -f2 | base64 -d 2>/dev/null | jq .


      - name: Setup AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${ACCOUNT_ID}:role/GitHubAccessRole
          aws-region: eu-north-1
          role-skip-session-tagging: true

      - name: HashiCorp - Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan.tfout

      - name: Terraform Apply
        if: ${{ github.event.inputs.apply == 'true' }}
        run: terraform apply -auto-approve tfplan.tfout         

      - name: Terraform plan destroy
        if: ${{ github.event.inputs.plan_destroy == 'true' }}
        run: terraform plan -destroy -out=tfplandestroy


      - name: Terraform destroy
        if: ${{ github.event.inputs.destroy == 'true' }}
        run: terraform apply  -destroy -auto-approve tfplandestroy   