server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}

# Porta só para métricas. Não é publicada com -p, por isso só é acessível dentro do Docker.
server {
    listen 8080;

    location /stub_status {
        stub_status;
    }
}